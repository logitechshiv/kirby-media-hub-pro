title: Media Hub Asset

# Upload whitelist — scripts/markup (js, xml, html, php…) are never accepted.
# Override per site with the `kirbycode.media-hub.accept` option.
accept:
  extension:
    - jpg
    - jpeg
    - png
    - gif
    - webp
    - avif
    - svg
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - ppt
    - pptx
    - odt
    - ods
    - odp
    - txt
    - csv
    - zip
    - gz
    - tar
    - ai
    - eps
    - psd
    - mp4
    - webm
    - mov
    - m4v
    - avi
    - mp3
    - wav
    - ogg
    - m4a

fields:
  title:
    label: Title
    type: text
    width: 1/2

  alt:
    label: Alt Text
    type: text
    width: 1/2
    help: Describe the image for accessibility and SEO.

  description:
    label: Description
    type: textarea
    size: small

  copyright:
    label: Copyright / License
    type: text
    width: 1/2

  photographer:
    label: Photographer / Author
    type: text
    width: 1/2

  aigenerated:
    label: AI-Generated
    type: toggle
    text:
      - 'No'
      - 'Yes'
    default: false
    width: 1/2

  uploaddate:
    label: Upload Date
    type: date
    default: today
    width: 1/2

  tags:
    label: Tags
    type: text
    width: 1/1

  uploadedby:
    label: Uploaded By
    type: text
    width: 1/2
    disabled: true
